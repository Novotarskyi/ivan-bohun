line x1="520" y1="136" x2="584" y2="136" stroke="#43e86a" stroke-width="2.6" marker-end="url(#a43e86a)"/><text x="900" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#43e86a" text-anchor="middle" letter-spacing=".03em">spliced to the least busy</text><rect x="50" y="286" width="1140" height="98" rx="12" fill="#16161c" stroke="#a05de0" stroke-width="1.6"/><text x="620" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#a05de0" text-anchor="middle" font-weight="700" letter-spacing=".03em">the control plane never touches the wire</text><text x="620" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">encrypted ESP-NOW heartbeats, 1 Hz - roster, health, a preemptive election: the lowest healthy serving id leads</text><text x="620" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">two radio-only witnesses paint it all on glass and a six-pixel rail; every image proves itself in a trial or rolls back</text><defs><marker id="aa05de0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a05de0"/></marker></defs><line x1="725" y1="216" x2="725" y2="280" stroke="#a05de0" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#aa05de0)"/><defs><marker id="aa05de0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a05de0"/></marker></defs><line x1="1065" y1="216" x2="1065" y2="280" stroke="#a05de0" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#aa05de0)"/><defs><marker id="aa05de0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a05de0"/></marke