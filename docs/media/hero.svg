<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 430" width="1240" height="430" role="img" aria-label="IVAN BOHUN architecture"><rect width="1240" height="430" rx="18" fill="#0a0a0c"/><rect x="1" y="1" width="1238" height="428" rx="17" fill="none" stroke="#26262e" stroke-width="2"/><rect x="50" y="88" width="190" height="96" rx="10" fill="#111115" stroke="#26262e" stroke-width="1.6"/><text x="145.0" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#e8e6e3" text-anchor="middle" font-weight="700" letter-spacing=".03em">the visitor</text><text x="145.0" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">https, from</text><text x="145.0" y="153" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">anywhere</text><rect x="310" y="88" width="210" height="96" rx="10" fill="#111115" stroke="#26262e" stroke-width="1.6"/><text x="415.0" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#e8e6e3" text-anchor="middle" font-weight="700" letter-spacing=".03em">the router</text><text x="415.0" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">forwards 80 + 443</text><text x="415.0" y="153" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">to one address -</text><text x="415.0" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">nothing else</text><rect x="590" y="60" width="270" height="152" rx="10" fill="#111115" stroke="#c4f04d" stroke-width="1.6"/><text x="725.0" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#c4f04d" text-anchor="middle" font-weight="700" letter-spacing=".03em">THE MASK</text><text x="725.0" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">a virtual MAC + one address,</text><text x="725.0" y="125" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">worn by the elected otaman</text><text x="725.0" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">an L4 splicer: relays raw</text><text x="725.0" y="159" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">bytes, never terminates TLS</text><text x="725.0" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">leader dies? re-worn in under 4 s</text><rect x="940" y="52" width="250" height="62" rx="10" fill="#111115" stroke="#43e86a" stroke-width="1.6"/><text x="1065.0" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#43e86a" text-anchor="middle" font-weight="700" letter-spacing=".03em">kozak</text><text x="1065.0" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">TLS 1.3 · the page from flash</text><defs><marker id="a43e86a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#43e86a"/></marker></defs><line x1="860" y1="136" x2="934" y2="83" stroke="#43e86a" stroke-width="2.6" marker-end="url(#a43e86a)"/><rect x="940" y="128" width="250" height="62" rx="10" f