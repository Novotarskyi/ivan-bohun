<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="ui-monospace,Menlo,monospace"><rect width="1440" height="1000" fill="#0a0a0c"/><defs><marker id="ma05de0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a05de0"/></marker><marker id="m9a98a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a98a0"/></marker><marker id="mc4f04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4f04d"/></marker><marker id="m4dc46a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4dc46a"/></marker><marker id="m5dc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5dc8f0"/></marker><marker id="mf0a04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a04d"/></marker><marker id="m5a5a64" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a64"/></marker><marker id="me05555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e05555"/></marker><marker id="me8e6e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8e6e3"/></marker></defs><text x="40" y="52" font-size="24" fill="#c4f04d" text-anchor="start" font-weight="700" letter-spacing=".05em">IVAN BOHUN - the system on one sheet</text><text x="40" y="78" font-size="12.5" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">six microcontrollers, one public identity: an elected leader relays every connection to the least-busy blade, and everything is watched on radio</text><text x="1400" y="52" font-size="13" fill="#5a5a64" text-anchor="end" letter-spacing=".03em">system-overview</text><rect x="60" y="130" width="250" height="70" fill="#16161c" stroke="#4dc46a" stroke-width="1.4" rx="8"/><text x="74" y="154" font-size="13.5" fill="#4dc46a" text-anchor="start" font-weight="600" letter-spacing=".03em">the visitor</text><text x="74" y="174" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">https, from anywhere</text><rect x="60" y="260" width="250" height="96" fill="#111115" stroke="#9a98a0" stroke-width="1.4" rx="8"/><text x="74" y="284" font-size="13.5" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">the router</text><text x="74" y="304" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">forwards TCP 80 + 443 to the</text><text x="74" y="320" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">mask's address - nothing else</text><text x="74" y="336" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">has an inbound path</text><rect x="60" y="416" width="250" height="110" fill="#111115" stroke="#c4f04d" stroke-width="1.4" rx="8"/><text x="74" y="440" font-size="13.5" fill="#c4f04d" text-anchor="start" font-weight="600" letter-spacing=".03em">THE MASK</text><text x="74" y="460" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">a virtual MAC + one reserved</text><text x="74" y="476" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">LAN address, worn by whoever</text><text x="74" y="492" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">wins the election - same</text><text x="74" y="508" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">identity, different silicon</text><line x1="185" y1="200" x2="185" y2="254" stroke="#4dc46a" stroke-width="2.4" marker-end="url(#m4dc46a)"/><line x1="185" y1="356" x2="185" y2="410" stroke="#4dc46a" stroke-width="2.4" marker-end="url(#m4dc46a)"/><text x="232" y="388" font-size="10.5" fill="#4dc46a" text-anchor="middle" letter-spacing=".03em">:443 · :80</text><rect x="370" y="130" width="330" height="250" fill="#111115" stroke="#c4f04d" stroke-width="1.4" rx="8"/><text x="384" y="154" font-size="13.5" fill="#c4f04d" text-anchor="start" font-weight="600" letter-spacing=".03em">the otaman - the elected leader</text><text x="384" y="174" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">wears the mask and runs the</text><text x="384" y="190" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">layer-4 TCP splicer: relays raw</text><text x="384" y="206" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">bytes to a kozak's LAN-only</text><text x="384" y="222" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">backend port</text><text x="384" y="238" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">never terminates TLS, never</text><text x="384" y="254" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">parses a byte it moves</text><text x="384" y="270" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">least connections · circuit</text><text x="384" y="286" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">breaker on returned bytes</text><text x="384" y="302" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">does not serve pages itself</text><rect x="760" y="130" width="200" height="250" fill="#111115" stroke="#4dc46a" stroke-width="1.4" rx="8"/><text x="774" y="154" font-size="13.5" fill="#4dc46a" text-anchor="start" font-weight="600" letter-spacing=".03em">kozak</text><text x="774" y="174" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">TLS 1.3 terminates</text><text x="774" y="190" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">here - the page</text><text x="774" y="206" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">served from flash,</text><text x="774" y="222" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">brotli or gzip</text><text x="774" y="238" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="774" y="254" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">self-probe every 7 s;</text><text x="774" y="270" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">a failing blade leaves</text><text x="774" y="286" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">the election itself</text><line x1="860" y1="104" x2="860" y2="124" stroke="#4dc46a" stroke-width="2.0" marker-end="url(#m4dc46a)"/><rect x="980" y="130" width="200" height="250" fill="#111115" stroke="#4dc46a" stroke-width="1.4" rx="8"/><text x="994" y="154" font-size="13.5" fill="#4dc46a" text-anchor="start" font-weight="600" letter-spacing=".03em">kozak</text><text x="994" y="174" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">TLS 1.3 terminates</text><text x="994" y="190" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">here - the page</text><text x="994" y="206" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">served from flash,</text><text x="994" y="222" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">brotli or gzip</text><text x="994" y="238" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="994" y="254" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">self-probe every 7 s;</text><text x="994" y="270" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">a failing blade leaves</text><text x="994" y="286" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">the election itself</text><line x1="1080" y1="104" x2="1080" y2="124" stroke="#4dc46a" stroke-width="2.0" marker-end="url(#m4dc46a)"/><rect x="1200" y="130" width="200" height="250" fill="#111115" stroke="#4dc46a" stroke-width="1.4" rx="8"/><text x="1214" y="154" font-size="13.5" fill="#4dc46a" text-anchor="start" font-weight="600" letter-spacing=".03em">kozak</text><text x="1214" y="174" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">TLS 1.3 terminates</text><text x="1214" y="190" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">here - the page</text><text x="1214" y="206" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">served from flash,</text><text x="1214" y="222" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">brotli or gzip</text><text x="1214" y="238" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="1214" y="254" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">self-probe every 7 s;</text><text x="1214" y="270" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">a failing blade leaves</text><text x="1214" y="286" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">the election itself</text><line x1="1300" y1="104" x2="1300" y2="124" stroke="#4dc46a" stroke-width="2.0" marker-end="url(#m4dc46a)"/><path d="M 620 130 C 620 104 640 104 660 104 L 1300 104" fill="none" stroke="#4dc46a" stroke-width="2.2"/><text x="700" y="96" font-size="10.5" fill="#4dc46a" text-anchor="start" letter-spacing=".03em">raw bytes, spliced to the least-busy backend</text><path d="M 314 470 C 340 470 344 330 366 306" fill="none" stroke="#c4f04d" stroke-width="2.0" marker-end="url(#mc4f04d)"/><text x="322" y="420" font-size="10.5" fill="#c4f04d" text-anchor="start" letter-spacing=".03em">worn by</text><rect x="370" y="440" width="1030" height="96" fill="#111115" stroke="#a05de0" stroke-width="1.4" rx="10"/><text x="384" y="468" font-size="13.5" fill="#a05de0" text-anchor="start" font-weight="600" letter-spacing=".03em">the control plane - encrypted ESP-NOW radio, never on the wire</text><text x="384" y="492" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">every member gossips a 1 Hz heartbeat: identity, work, health, release, the load balancer's ledger. The election is</text><text x="384" y="508" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">preemptive arithmetic - the lowest id that is alive, linked and serving leads - so a switch or cable failure cannot split the brain.</text><line x1="535" y1="386" x2="535" y2="434" stroke="#a05de0" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#ma05de0)"/><line x1="860" y1="386" x2="860" y2="434" stroke="#a05de0" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#ma05de0)"/><line x1="1080" y1="386" x2="1080" y2="434" stroke="#a05de0" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#ma05de0)"/><line x1="1300" y1="386" x2="1300" y2="434" stroke="#a05de0" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#ma05de0)"/><rect x="370" y="596" width="380" height="170" fill="#111115" stroke="#5dc8f0" stroke-width="1.4" rx="8"/><text x="384" y="620" font-size="13.5" fill="#5dc8f0" text-anchor="start" font-weight="600" letter-spacing=".03em">pysar - the 2.8" witness</text><text x="384" y="640" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">hears every heartbeat, serves</text><text x="384" y="656" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">nothing: the roster on glass and</text><text x="384" y="672" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">a six-pixel LED rail, one pixel</text><text x="384" y="688" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">per member, colour = state</text><text x="384" y="704" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">radio-only - no Ethernet, no IP</text><rect x="810" y="596" width="380" height="170" fill="#111115" stroke="#a05de0" stroke-width="1.4" rx="8"/><text x="824" y="620" font-size="13.5" fill="#a05de0" text-anchor="start" font-weight="600" letter-spacing=".03em">kobzar - the 4.3" witness</text><text x="824" y="640" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">five touch tiles: mission control</text><text x="824" y="656" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">with the chronicle and reign</text><text x="824" y="672" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">records, the request ledger, the</text><text x="824" y="688" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">radio tail, the served page itself</text><text x="824" y="704" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">radio-only - no Ethernet, no IP</text><line x1="560" y1="536" x2="560" y2="590" stroke="#a05de0" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#ma05de0)"/><line x1="1000" y1="536" x2="1000" y2="590" stroke="#a05de0" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#ma05de0)"/><rect x="60" y="596" width="250" height="170" fill="#111115" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="74" y="620" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">the operator</text><text x="74" y="640" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">LAN only, never forwarded:</text><text x="74" y="656" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">:8443 admin plane, key-gated -</text><text x="74" y="672" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">roster with addresses, blackbox,</text><text x="74" y="688" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">coredump, /ota</text><text x="74" y="704" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">deploys roll followers first,</text><text x="74" y="720" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">leader last</text><path d="M 314 640 C 348 640 334 430 366 400" fill="none" stroke="#f0a04d" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#mf0a04d)"/><text x="318" y="560" font-size="10.5" fill="#f0a04d" text-anchor="start" letter-spacing=".03em">to every blade,</text><text x="318" y="574" font-size="10.5" fill="#f0a04d" text-anchor="start" letter-spacing=".03em">over the wire</text><rect x="60" y="820" width="420" height="130" fill="#111115" stroke="#4dc46a" stroke-width="1.4" rx="8"/><text x="74" y="844" font-size="13.5" fill="#4dc46a" text-anchor="start" font-weight="600" letter-spacing=".03em">self-healing, twice over</text><text x="74" y="864" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">each blade probes itself from inside;</text><text x="74" y="880" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">the splicer judges it from outside by</text><text x="74" y="896" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">returned bytes. A bench shapes choice</text><text x="74" y="912" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">and never refuses a visitor.</text><rect x="510" y="820" width="420" height="130" fill="#111115" stroke="#c4f04d" stroke-width="1.4" rx="8"/><text x="524" y="844" font-size="13.5" fill="#c4f04d" text-anchor="start" font-weight="600" letter-spacing=".03em">failure is routine</text><text x="524" y="864" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">pull any plug: the mask moves to the</text><text x="524" y="880" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">next blade in under 4 s - same MAC,</text><text x="524" y="896" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">same address, same certificate. The</text><text x="524" y="912" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">ladder runs N backends down to solo.</text><rect x="960" y="820" width="440" height="130" fill="#111115" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="974" y="844" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">releases cannot brick the fleet</text><text x="974" y="864" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">one key-gated, variant-guarded /ota door</text><text x="974" y="880" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">for all six members; every fresh image</text><text x="974" y="896" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">must prove itself in a trial or the</text><text x="974" y="912" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">bootloader rolls back the slot.</text></svg>