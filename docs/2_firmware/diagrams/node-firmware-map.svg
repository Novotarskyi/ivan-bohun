<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" font-family="ui-monospace,Menlo,monospace"><rect width="1440" height="1100" fill="#0a0a0c"/><defs><marker id="ma05de0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a05de0"/></marker><marker id="m9a98a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a98a0"/></marker><marker id="mc4f04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4f04d"/></marker><marker id="m4dc46a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4dc46a"/></marker><marker id="m5dc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5dc8f0"/></marker><marker id="mf0a04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a04d"/></marker><marker id="m5a5a64" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a64"/></marker><marker id="me05555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e05555"/></marker><marker id="me8e6e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8e6e3"/></marker></defs><text x="40" y="52" font-size="24" fill="#c4f04d" text-anchor="start" font-weight="700" letter-spacing=".05em">THE BLADE FIRMWARE - components and seams</text><text x="40" y="78" font-size="12.5" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">one image per blade: serve + swarm + mask + splicer - three planes, read top to bottom</text><text x="1400" y="52" font-size="13" fill="#5a5a64" text-anchor="end" letter-spacing=".03em">node-firmware-map</text><text x="230.0" y="118" font-size="12" fill="#a05de0" text-anchor="middle" font-weight="700" letter-spacing=".14em">THE RADIO PLANE</text><text x="685.0" y="118" font-size="12" fill="#4dc46a" text-anchor="middle" font-weight="700" letter-spacing=".14em">THE SERVING PLANE</text><text x="1175.0" y="118" font-size="12" fill="#f0a04d" text-anchor="middle" font-weight="700" letter-spacing=".14em">THE OPERATOR PLANE</text><rect x="40" y="140" width="380" height="58" fill="#16161c" stroke="#a05de0" stroke-width="1.4" rx="8"/><text x="54" y="164" font-size="13.5" fill="#a05de0" text-anchor="start" font-weight="600" letter-spacing=".03em">the fleet</text><text x="54" y="184" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">every member's heartbeat, 1 Hz, encrypted</text><rect x="40" y="232" width="380" height="52" fill="#16161c" stroke="#a05de0" stroke-width="1.2" rx="7"/><text x="230.0" y="250.0" font-size="12.5" fill="#a05de0" text-anchor="middle" font-weight="600" letter-spacing=".03em">ESP-NOW radio</text><text x="230.0" y="270.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">frames by MAC on a pinned channel - no network joined</text><rect x="40" y="318" width="380" height="212" fill="#111115" stroke="#a05de0" stroke-width="1.4" rx="8"/><text x="54" y="342" font-size="13.5" fill="#a05de0" text-anchor="start" font-weight="600" letter-spacing=".03em">swarm.c - the control plane</text><text x="54" y="362" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">swarm_hb_tx: the 1 Hz heartbeat out</text><text x="54" y="378" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">RX callback -&gt; queue -&gt; swarm_monitor</text><text x="54" y="394" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">roster: last frame + age per member</text><text x="54" y="410" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">election every 200 ms: lowest id that</text><text x="54" y="426" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  is alive + linked + serving leads</text><text x="54" y="442" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">  (the rule: logic.h, host-tested)</text><text x="54" y="458" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">swarm_snapshot() - the exported view</text><text x="54" y="474" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">weak seam: serve_is_ready/_real stubs -</text><text x="54" y="490" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">  the observers link this same file</text><rect x="40" y="564" width="380" height="76" fill="#111115" stroke="#9a98a0" stroke-width="1.4" rx="8"/><text x="54" y="588" font-size="13.5" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">swarm_identity.c - the ledger</text><text x="54" y="608" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">eFuse MAC -&gt; fleet id, name, hostname,</text><text x="54" y="624" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">eligibility; unknown MAC = serve nothing</text><rect x="40" y="658" width="380" height="48" fill="#16161c" stroke="#9a98a0" stroke-width="1.2" rx="7"/><text x="230.0" y="674.0" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">eFuse base MAC</text><text x="230.0" y="694.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">factory-burned identity, read at boot</text><rect x="40" y="744" width="380" height="180" fill="#111115" stroke="#c4f04d" stroke-width="1.4" rx="8"/><text x="54" y="768" font-size="13.5" fill="#c4f04d" text-anchor="start" font-weight="600" letter-spacing=".03em">mask.c - the public identity</text><text x="54" y="788" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">win the election: vMAC into the W5500</text><text x="54" y="804" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  (SHAR ioctl), the mask's static address,</text><text x="54" y="820" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  gratuitous-ARP burst</text><text x="54" y="836" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">lose: drain the splicer's relays first,</text><text x="54" y="852" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  then restore the remembered DHCP lease</text><text x="54" y="868" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">mask_tick: wearing-but-not-ready =</text><text x="54" y="884" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  abdicate - never reign over nothing</text><line x1="230.0" y1="198" x2="230.0" y2="226" stroke="#a05de0" stroke-width="1.8" marker-end="url(#ma05de0)"/><line x1="230.0" y1="284" x2="230.0" y2="312" stroke="#a05de0" stroke-width="1.8" marker-end="url(#ma05de0)"/><line x1="230.0" y1="658" x2="230.0" y2="630" stroke="#9a98a0" stroke-width="1.8" marker-end="url(#m9a98a0)"/><line x1="230.0" y1="548" x2="230.0" y2="520" stroke="#9a98a0" stroke-width="1.8" marker-end="url(#m9a98a0)"/><text x="288.0" y="527.0" font-size="10.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">who am I</text><path d="M 40 500 C 18 500 18 510 18 530 L 18 740 C 18 760 26 764 38 766" fill="none" stroke="#c4f04d" stroke-width="1.8" marker-end="url(#mc4f04d)"/><text x="12" y="640" font-size="10.5" fill="#c4f04d" text-anchor="middle" letter-spacing=".03em" transform="rotate(-90 12 640)">won / lost</text><rect x="470" y="140" width="430" height="58" fill="#16161c" stroke="#4dc46a" stroke-width="1.4" rx="8"/><text x="484" y="164" font-size="13.5" fill="#4dc46a" text-anchor="start" font-weight="600" letter-spacing=".03em">the visitor</text><text x="484" y="184" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">browser -&gt; :443 on the mask - TLS runs end-to-end</text><rect x="470" y="232" width="430" height="52" fill="#16161c" stroke="#4dc46a" stroke-width="1.2" rx="7"/><text x="685.0" y="250.0" font-size="12.5" fill="#4dc46a" text-anchor="middle" font-weight="600" letter-spacing=".03em">:443 - the public port</text><text x="685.0" y="270.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">answered only by whoever wears the mask</text><rect x="470" y="318" width="430" height="160" fill="#111115" stroke="#4dc46a" stroke-width="1.4" rx="8"/><text x="484" y="342" font-size="13.5" fill="#4dc46a" text-anchor="start" font-weight="600" letter-spacing=".03em">splice.c - the load balancer</text><text x="484" y="362" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">layer-4 TCP splicer: relays raw bytes,</text><text x="484" y="378" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">never terminates TLS, never parses HTTP</text><text x="484" y="394" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">least-connections · hard caps, no queues</text><text x="484" y="410" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">circuit breaker: benches on returned</text><text x="484" y="426" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  bytes, never on gossiped claims</text><rect x="470" y="542" width="430" height="200" fill="#111115" stroke="#5dc8f0" stroke-width="1.4" rx="8"/><text x="484" y="566" font-size="13.5" fill="#5dc8f0" text-anchor="start" font-weight="600" letter-spacing=".03em">serve.c - the servers</text><text x="484" y="586" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">backend :8080 - TLS 1.3 page server;</text><text x="484" y="602" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  the page memcpy'd from flash, br/gz,</text><text x="484" y="618" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  ETag + 304</text><text x="484" y="634" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">:8443 - the admin instance (LAN-only)</text><text x="484" y="650" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">:80 - 301 redirect, host allowlist</text><text x="484" y="666" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">self-probe: loopback connect every 7 s</text><rect x="640" y="776" width="260" height="48" fill="#16161c" stroke="#9a98a0" stroke-width="1.2" rx="7"/><text x="770.0" y="792.0" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">assets</text><text x="770.0" y="812.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">personal.html br+gz · certs baked in</text><rect x="470" y="858" width="430" height="66" fill="#111115" stroke="#9a98a0" stroke-width="1.4" rx="8"/><text x="484" y="882" font-size="13.5" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">W5500 + lwIP - the wire</text><text x="484" y="902" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">Ethernet MAC+PHY over SPI; the SHAR register is what the mask rewrites</text><line x1="685.0" y1="198" x2="685.0" y2="226" stroke="#4dc46a" stroke-width="2.4" marker-end="url(#m4dc46a)"/><line x1="685.0" y1="284" x2="685.0" y2="312" stroke="#4dc46a" stroke-width="2.4" marker-end="url(#m4dc46a)"/><line x1="685.0" y1="478" x2="685.0" y2="536" stroke="#4dc46a" stroke-width="2.4" marker-end="url(#m4dc46a)"/><text x="673.0" y="514" font-size="10.5" fill="#4dc46a" text-anchor="end" letter-spacing=".03em">relay to any kozak's :8080 (its own included)</text><line x1="770.0" y1="776" x2="770.0" y2="748" stroke="#9a98a0" stroke-width="1.8" marker-end="url(#m9a98a0)"/><line x1="550" y1="858" x2="550" y2="748" stroke="#9a98a0" stroke-width="1.8" marker-end="url(#m9a98a0)"/><text x="538" y="812" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em" transform="rotate(-90 538 812)">sockets</text><line x1="420" y1="372" x2="470" y2="372" stroke="#4dc46a" stroke-width="1.8" marker-end="url(#m4dc46a)"/><text x="445" y="452" font-size="10.5" fill="#4dc46a" text-anchor="middle" letter-spacing=".03em" transform="rotate(-90 445 452)">backend table, 1 Hz</text><path d="M 470 600 C 436 600 454 500 424 484" fill="none" stroke="#5dc8f0" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#m5dc8f0)"/><text x="428" y="646" font-size="10.5" fill="#5dc8f0" text-anchor="middle" letter-spacing=".03em" transform="rotate(-90 428 646)">flags + counters -&gt; heartbeat</text><path d="M 424 850 C 410 852 430 876 466 884" fill="none" stroke="#c4f04d" stroke-width="1.8" marker-end="url(#mc4f04d)"/><text x="445" y="838" font-size="10.5" fill="#c4f04d" text-anchor="middle" letter-spacing=".03em" transform="rotate(-90 445 838)">SHAR + gARP + address</text><rect x="950" y="140" width="450" height="58" fill="#16161c" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="964" y="164" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">the operator</text><text x="964" y="184" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">deploy.sh / fleet_check.sh - LAN-only, key-gated</text><rect x="950" y="232" width="450" height="52" fill="#16161c" stroke="#f0a04d" stroke-width="1.2" rx="7"/><text x="1175.0" y="250.0" font-size="12.5" fill="#f0a04d" text-anchor="middle" font-weight="600" letter-spacing=".03em">:8443 - the admin plane</text><text x="1175.0" y="270.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">an instance inside serve.c - roster+, blackbox, cpu, /ota</text><rect x="950" y="318" width="450" height="160" fill="#111115" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="964" y="342" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">ota.c + selftest.c - releases</text><text x="964" y="362" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">POST /ota: key gate + fail-closed variant</text><text x="964" y="378" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  guard (wrong project_name = 409,</text><text x="964" y="394" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  nothing written), then dual-slot write</text><text x="964" y="410" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">boot PENDING_VERIFY -&gt; selftest: 90 s of</text><text x="964" y="426" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  real serving within 300 s, or rollback</text><rect x="950" y="542" width="450" height="130" fill="#111115" stroke="#9a98a0" stroke-width="1.4" rx="8"/><text x="964" y="566" font-size="13.5" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">forensics</text><text x="964" y="586" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">blackbox.c: 4096-record flash ring - boots,</text><text x="964" y="602" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  5xx, OOM, mask moves, trial verdicts</text><text x="964" y="618" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">coredump partition: panic post-mortems</text><text x="964" y="634" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">vitals.c die temp · cpustat.c /cpu</text><rect x="950" y="706" width="450" height="96" fill="#111115" stroke="#9a98a0" stroke-width="1.4" rx="8"/><text x="964" y="730" font-size="13.5" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">NVS</text><text x="964" y="750" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">election generation tally, lease</text><text x="964" y="766" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">memory - what must survive a reboot</text><line x1="1175.0" y1="198" x2="1175.0" y2="226" stroke="#f0a04d" stroke-width="1.8" marker-end="url(#mf0a04d)"/><line x1="1175.0" y1="284" x2="1175.0" y2="312" stroke="#f0a04d" stroke-width="1.8" marker-end="url(#mf0a04d)"/><text x="964" y="522" font-size="10.5" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">every module above records into the boxes below; none reads them back</text><rect x="40" y="960" width="1360" height="100" fill="#111115" stroke="#2a2a33" stroke-width="1.2" rx="8"/><line x1="60" y1="986" x2="86" y2="986" stroke="#4dc46a" stroke-width="2.4"/><text x="94" y="990" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">visitor bytes - TLS end-to-end, opaque to the splicer</text><line x1="507.0" y1="986" x2="533.0" y2="986" stroke="#a05de0" stroke-width="2.4"/><text x="541.0" y="990" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">radio gossip - encrypted ESP-NOW, never on the wire</text><line x1="940.0" y1="986" x2="966.0" y2="986" stroke="#f0a04d" stroke-width="2.4"/><text x="974.0" y="990" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">operator plane - :8443, key-gated</text><line x1="60" y1="1010" x2="86" y2="1010" stroke="#c4f04d" stroke-width="2.4"/><text x="94" y="1014" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">the mask - identity choreography</text><line x1="360.0" y1="1010" x2="386.0" y2="1010" stroke="#5dc8f0" stroke-width="2.4"/><text x="394.0" y="1014" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">serving state into the gossip</text><line x1="639.0" y1="1010" x2="665.0" y2="1010" stroke="#5a5a64" stroke-width="2.4"/><text x="673.0" y="1014" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">solid = data flow · dashed = signal</text><text x="60" y="1046" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">the weak-symbol seam is what lets the observers compile this same control plane with no server aboard</text></svg>