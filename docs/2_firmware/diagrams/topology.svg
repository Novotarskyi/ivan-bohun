<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
<rect width="1060" height="800" fill="#0a0a0c"/>
<text x="28" y="40" font-size="18" fill="#c4f04d" font-weight="700" letter-spacing=".04em">TOPOLOGY - physical and logical</text>
<text x="1032" y="40" font-size="11" fill="#7a7880" text-anchor="end">topology</text>
<text x="28" y="88" font-size="13" fill="#e8e6e3">PHYSICAL - one wire in, four blades on it, two members with no wire at all</text>
<rect x="40" y="114" width="120" height="56" rx="6" fill="#111115" stroke="#a8a6a3" stroke-width="1.4"/>
<text x="100.0" y="138" font-size="12" fill="#a8a6a3" text-anchor="middle">wall socket</text>
<text x="100.0" y="156" font-size="10.5" fill="#7a7880" text-anchor="middle">fibre</text>
<rect x="220" y="114" width="130" height="56" rx="6" fill="#111115" stroke="#a8a6a3" stroke-width="1.4"/>
<text x="285.0" y="138" font-size="12" fill="#a8a6a3" text-anchor="middle">ISP CPE</text>
<text x="285.0" y="156" font-size="10.5" fill="#7a7880" text-anchor="middle">holds the static IP</text>
<rect x="410" y="114" width="130" height="56" rx="6" fill="#111115" stroke="#a8a6a3" stroke-width="1.4"/>
<text x="475.0" y="138" font-size="12" fill="#a8a6a3" text-anchor="middle">powerline pair</text>
<text x="475.0" y="156" font-size="10.5" fill="#7a7880" text-anchor="middle">room to room</text>
<rect x="600" y="114" width="150" height="56" rx="6" fill="#111115" stroke="#e8e6e3" stroke-width="1.4"/>
<text x="675.0" y="138" font-size="12" fill="#e8e6e3" text-anchor="middle">8-port GbE switch</text>
<text x="675.0" y="156" font-size="10.5" fill="#7a7880" text-anchor="middle">the backplane</text>
