<text x="650" y="304" font-size="10.5" fill="#7a7880" text-anchor="middle">serving blades - wired Ethernet, ESP-NOW radio</text>
<rect x="120" y="234" width="120" height="46" rx="6" fill="#111115" stroke="#4da3ff" stroke-width="1.4"/>
<text x="180.0" y="261.0" font-size="12" fill="#4da3ff" text-anchor="middle">pysar</text>
<rect x="260" y="234" width="140" height="46" rx="6" fill="#111115" stroke="#b06af0" stroke-width="1.4"/>
<text x="330.0" y="261.0" font-size="12" fill="#b06af0" text-anchor="middle">kobzar</text>
<text x="260" y="304" font-size="10.5" fill="#7a7880" text-anchor="middle">observers - radio only, no Ethernet</text>
