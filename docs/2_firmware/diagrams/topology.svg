<text x="530.0" y="358" font-size="11" fill="#ffb020" text-anchor="middle">ESP-NOW encrypted radio, channel-pinned, 1 Hz heartbeats - all six members</text>
<rect x="870" y="144" width="150" height="96" rx="6" fill="#111115" stroke="#a8a6a3" stroke-width="1.4"/>
<text x="945.0" y="168" font-size="12" fill="#a8a6a3" text-anchor="middle">USB power tower</text>
<text x="945.0" y="186" font-size="10.5" fill="#7a7880" text-anchor="middle">six USB-C feeds</text>
<text x="945" y="220" font-size="10.5" fill="#7a7880" text-anchor="middle">one plug for the fleet</text>
<line x1="28" y1="376" x2="1032" y2="376" stroke="#2a2a33"/>
<text x="28" y="400" font-size="13" fill="#e8e6e3">LOGICAL - two forwarded ports, one speaker, raw bytes spliced to whoever is least busy</text>
<rect x="40" y="458" width="130" height="66" rx="6" fill="#111115" stroke="#e8e6e3" stroke-width="1.4"/>
<text x="105.0" y="482" font-size="12" fill="#e8e6e3" text-anchor="middle">the world</text>
<text x="105.0" y="500" font-size="10.5" fill="#7a7880" text-anchor="middle">https</text>
<rect x="240" y="458" width="150" height="66" rx="6" fill="#111115" stroke="#a8a6a3" stroke-width="1.4"/>
<text x="315.0" y="482" font-size="12" fill="#a8a6a3" text-anchor="middle">router</text>
<text x="315.0" y="500" font-size="10.5" fill="#7a7880" text-anchor="middle">forwards 80 + 443,</text>
<text x="315" y="516" font-size="10.5" fill="#7a7880" text-anchor="middle">nothing else</text>
<line x1="170" y1="491" x2="240" y2="491" stroke="#e8e6e3" stroke-width="1.6"/>
<rect x="470" y="446" width="190" height="90" rx="6" fill="#111115" stroke="#c4f04d" stroke-width="1.4"/>
<text x="565.0" y="470" font-size="12" fill="#c4f04d" text-anchor="middle">THE MASK</text>
<text x="565.0" y="488" font-size="10.5" fill="#7a7880" text-anchor="middle">elected otaman:</text>
<text x="565" y="504" font-size="10.5" fill="#7a7880" text-anchor="middle">L4 TCP splicer -</text>
<text x="565" y="520" font-size="10.5" fill="#7a7880" text-anchor="middle">relays raw bytes, no TLS</text>
<line x1="390" y1="491" x2="470" y2="491" stroke="#c4f04d" stroke-width="1.6"/>
<text x="430" y="480" font-size="10" fill="#a8a6a3" text-anchor="middle">:443 :80</text>
<rect x="760" y="414" width="150" height="62" rx="6" fill="#111115" stroke="#43e86a" stroke-width="1.4"/>
<text x="835.0" y="438" font-size="12" fill="#43e86a" text-anchor="middle">kozak</text>
<text x="835.0" y="456" font-size="10.5" fill="#7a7880" text-anchor="middle">terminates TLS 1.3,</text>
<text x="835" y="470" font-size="9.5" fill="#7a7880" text-anchor="middle">serves from flash</text>
<line x1="660" y1="491" x2="760" y2="445" stroke="#43e86a" stroke-width="1.3"/>
<rect x="760" y="488" width="150" height="62" rx="6" fill="#111115" stroke="#43e86a" stroke-width="1.4"/>
<text x="835.0" y="512" font-size="12" fill="#43e86a" text-anchor="middle">kozak</text>
<text x="835.0" y="530" font-size="10.5" fill="#7a7880" text-anchor="middle">terminates TLS 1.3,</text>
<text x="835" y="544" font-size="9.5" fill="#7a7880" text-anchor="middle">serves from flash</text>
<line x1="660" y1="491" x2="760" y2="519" stroke="#43e86a" stroke-width="1.3"/>
<rect x="760" y="562" width="150" height="62" rx="6" fill="#111115" stroke="#43e86a" stroke-width="1.4"/>
<text x="835.0" y="586" font-size="12" fill="#43e86a" text-anchor="middle">kozak</text>
<text x="835.0" y="604" font-size="10.5" fill="#7a7880" text-anchor="middle">terminates TLS 1.3,</text>
<text x="835" y="618" font-size="9.5" fill="#7a7880" text-anchor="middle">serves from flash</text>
<line x1="660" y1="491" x2="760" y2="593" stroke="#43e86a" stroke-width="1.3"/>
<text x="710" y="458" font-size="10" fill="#43e86a" text-anchor="middle">backend port,</text>
<text x="710" y="472" font-size="10" fill="#43e86a" text-anchor="middle">LAN only</text>
<rect x="410" y="654" width="560" height="50" rx="6" fill="#111115" stroke="#ffb020" stroke-dasharray="5 4"/>
<text x="690" y="675" font-size="11" fill="#ffb020" text-anchor="middle">admin plane :8443 - every blade, LAN only, key-gated, never forwarded</text>
<text x="690" y="693" font-size="10" fill="#7a7880" text-anchor="middle">roster with addresses, blackbox, coredump, OTA</text>
<rect x="40" y="730" width="980" height="46" rx="6" fill="#111115" stroke="#ffb020"/>
<text x="530.0" y="750" font-size="11" fill="#ffb020" text-anchor="middle">control plane: ESP-NOW encrypted radio - elections, roster, the whole heartbeat</text>
<text x="530.0" y="767" font-size="10" fill="#7a7880" text-anchor="middle">never rides the wire it protects: a switch or cable failure cannot split the brain</text>
