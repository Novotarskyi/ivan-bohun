<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" font-family="ui-monospace,Menlo,monospace"><rect width="1440" height="880" fill="#0a0a0c"/><defs><marker id="ma05de0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a05de0"/></marker><marker id="m9a98a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a98a0"/></marker><marker id="mc4f04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4f04d"/></marker><marker id="m4dc46a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4dc46a"/></marker><marker id="m5dc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5dc8f0"/></marker><marker id="mf0a04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a04d"/></marker><marker id="m5a5a64" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a64"/></marker><marker id="me05555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e05555"/></marker><marker id="me8e6e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8e6e3"/></marker></defs><text x="40" y="52" font-size="24" fill="#c4f04d" text-anchor="start" font-weight="700" letter-spacing=".05em">THE PYSAR FIRMWARE - radio in, glass and light out</text><text x="40" y="78" font-size="12.5" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">bohun_display: the shared control plane heard on radio, painted by one render task - plus the touch ladder and the OTA window</text><text x="1400" y="52" font-size="13" fill="#5a5a64" text-anchor="end" letter-spacing=".03em">display-firmware-map</text><text x="230.0" y="118" font-size="12" fill="#a05de0" text-anchor="middle" font-weight="700" letter-spacing=".14em">THE RADIO PLANE</text><text x="705.0" y="118" font-size="12" fill="#5dc8f0" text-anchor="middle" font-weight="700" letter-spacing=".14em">THE RENDER PLANE</text><text x="1195.0" y="118" font-size="12" fill="#f0a04d" text-anchor="middle" font-weight="700" letter-spacing=".14em">TOUCH + RELEASES</text><rect x="40" y="140" width="380" height="58" fill="#16161c" stroke="#a05de0" stroke-width="1.4" rx="8"/><text x="54" y="164" font-size="13.5" fill="#a05de0" text-anchor="start" font-weight="600" letter-spacing=".03em">the fleet</text><text x="54" y="184" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">every member's heartbeat, 1 Hz, encrypted</text><rect x="40" y="232" width="380" height="52" fill="#16161c" stroke="#a05de0" stroke-width="1.2" rx="7"/><text x="230.0" y="250.0" font-size="12.5" fill="#a05de0" text-anchor="middle" font-weight="600" letter-spacing=".03em">ESP-NOW radio</text><text x="230.0" y="270.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">hears everything, can win nothing</text><rect x="40" y="318" width="380" height="150" fill="#111115" stroke="#a05de0" stroke-width="1.4" rx="8"/><text x="54" y="342" font-size="13.5" fill="#a05de0" text-anchor="start" font-weight="600" letter-spacing=".03em">the shared control plane</text><text x="54" y="362" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">swarm.c + swarm_identity.c + mask.c</text><text x="54" y="378" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">+ logic.h, straight out of eth/main/</text><text x="54" y="394" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">witness: eligible=false - the mask code</text><text x="54" y="410" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">aboard is simply never exercised</text><text x="54" y="426" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">weak stubs stand in for the servers</text><rect x="40" y="502" width="380" height="56" fill="#16161c" stroke="#c4f04d" stroke-width="1.2" rx="7"/><text x="230.0" y="522.0" font-size="12.5" fill="#c4f04d" text-anchor="middle" font-weight="600" letter-spacing=".03em">swarm_snapshot()</text><text x="230.0" y="542.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">the single fleet view everything paints from</text><rect x="40" y="596" width="380" height="96" fill="#111115" stroke="#9a98a0" stroke-width="1.4" rx="8"/><text x="54" y="620" font-size="13.5" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">LOST within 3 s</text><text x="54" y="640" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">a member that falls silent is painted</text><text x="54" y="656" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">LOST at the radio threshold - the glass</text><text x="54" y="672" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">cannot quietly freeze on stale state</text><line x1="230.0" y1="198" x2="230.0" y2="226" stroke="#a05de0" stroke-width="1.8" marker-end="url(#ma05de0)"/><line x1="230.0" y1="284" x2="230.0" y2="312" stroke="#a05de0" stroke-width="1.8" marker-end="url(#ma05de0)"/><line x1="230.0" y1="468" x2="230.0" y2="496" stroke="#c4f04d" stroke-width="1.8" marker-end="url(#mc4f04d)"/><rect x="470" y="140" width="470" height="76" fill="#111115" stroke="#5dc8f0" stroke-width="1.4" rx="8"/><text x="484" y="164" font-size="13.5" fill="#5dc8f0" text-anchor="start" font-weight="600" letter-spacing=".03em">display_main.c - the render loop</text><text x="484" y="184" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">one task ticks every 250 ms:</text><text x="484" y="200" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">led_render every tick (4 Hz) · tft_render every fourth (1 Hz)</text><rect x="470" y="252" width="470" height="190" fill="#111115" stroke="#5dc8f0" stroke-width="1.4" rx="8"/><text x="484" y="276" font-size="13.5" fill="#5dc8f0" text-anchor="start" font-weight="600" letter-spacing=".03em">tft.c - the glass (2.8" ST7789, LVGL)</text><text x="484" y="296" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">head: IVAN BOHUN · own name · fw version</text><text x="484" y="312" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">radio-loss line, colored by severity</text><text x="484" y="328" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">roster: mask addr + vMAC, one row per</text><text x="484" y="344" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  member - fixed-markup monospace</text><text x="484" y="360" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">foot: quorum, fleet served, availability</text><text x="484" y="376" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">rail mirror: six on-glass pixel chips</text><text x="484" y="392" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">OTA window: head becomes amber banner</text><rect x="470" y="478" width="470" height="190" fill="#111115" stroke="#5dc8f0" stroke-width="1.4" rx="8"/><text x="484" y="502" font-size="13.5" fill="#5dc8f0" text-anchor="start" font-weight="600" letter-spacing=".03em">led.c - the rail (6x SK6812 RGBW)</text><text x="484" y="522" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">one pixel per member, the colour law:</text><text x="484" y="538" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  lost red · booting amber-fast · release</text><text x="484" y="554" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  amber-slow · benched amber · otaman</text><text x="484" y="570" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  green · serving white · pysar blue ·</text><text x="484" y="586" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  kobzar purple</text><text x="484" y="602" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">40 ms animator, one shared blink phase;</text><text x="484" y="618" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">one strip lock; one brightness cap</text><rect x="470" y="704" width="220" height="52" fill="#16161c" stroke="#9a98a0" stroke-width="1.2" rx="7"/><text x="580.0" y="722.0" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">ST7789 over SPI</text><text x="580.0" y="742.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">the panel</text><rect x="720" y="704" width="220" height="52" fill="#16161c" stroke="#9a98a0" stroke-width="1.2" rx="7"/><text x="830.0" y="722.0" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">SK6812 on GPIO4</text><text x="830.0" y="742.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">the rail, via the shifter</text><path d="M 424 528 C 430 528 430 190 466 184" fill="none" stroke="#c4f04d" stroke-width="2.2" marker-end="url(#mc4f04d)"/><text x="444" y="420" font-size="10.5" fill="#c4f04d" text-anchor="middle" letter-spacing=".03em" transform="rotate(-90 444 420)">snapshot, 4 Hz</text><line x1="705.0" y1="216" x2="705.0" y2="246" stroke="#5dc8f0" stroke-width="1.8" marker-end="url(#m5dc8f0)"/><line x1="705.0" y1="442" x2="705.0" y2="472" stroke="#5dc8f0" stroke-width="1.8" marker-end="url(#m5dc8f0)"/><line x1="580" y1="668" x2="580" y2="698" stroke="#9a98a0" stroke-width="1.8" marker-end="url(#m9a98a0)"/><line x1="830" y1="668" x2="830" y2="698" stroke="#9a98a0" stroke-width="1.8" marker-end="url(#m9a98a0)"/><rect x="990" y="140" width="410" height="58" fill="#16161c" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="1004" y="164" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">a finger</text><text x="1004" y="184" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">the INT line pulses low on any touch</text><rect x="990" y="232" width="410" height="130" fill="#111115" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="1004" y="256" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">the gesture ladder (tp_blank)</text><text x="1004" y="276" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">tap        blank / wake the backlight</text><text x="1004" y="292" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">hold 1.2 s maintenance blackout -</text><text x="1004" y="308" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">           screen AND rail dark</text><text x="1004" y="324" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">hold 4 s   open the OTA window</text><rect x="990" y="398" width="410" height="170" fill="#111115" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="1004" y="422" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">ota_window.c - the release path</text><text x="1004" y="442" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">joins WiFi by hand (45 s budget), starts</text><text x="1004" y="458" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">:8443 with the same key-gated /ota door,</text><text x="1004" y="474" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">shows the address on the glass, blinks</text><text x="1004" y="490" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">the rail amber, closes itself at 600 s</text><text x="1004" y="506" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">a tap cancels; an image extends 60 s</text><rect x="990" y="604" width="410" height="88" fill="#111115" stroke="#9a98a0" stroke-width="1.4" rx="8"/><text x="1004" y="628" font-size="13.5" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">dual slots + boot trial</text><text x="1004" y="648" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">a fresh image must hear one peer within</text><text x="1004" y="664" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">its trial or the bootloader rolls back</text><line x1="1195.0" y1="198" x2="1195.0" y2="226" stroke="#f0a04d" stroke-width="1.8" marker-end="url(#mf0a04d)"/><line x1="1195.0" y1="362" x2="1195.0" y2="392" stroke="#f0a04d" stroke-width="1.8" marker-end="url(#mf0a04d)"/><text x="1221.0" y="370.0" font-size="10.5" fill="#f0a04d" text-anchor="middle" letter-spacing=".03em">4 s</text><line x1="1195.0" y1="568" x2="1195.0" y2="598" stroke="#f0a04d" stroke-width="1.8" marker-end="url(#mf0a04d)"/><text x="40" y="790" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">no Ethernet, no IP, no lease - the only WiFi this board ever touches is inside the window. The first flash goes over USB; every release after</text><text x="40" y="808" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">travels by air: tools/deploy_observer.sh display &lt;address off the glass&gt;.</text></svg>