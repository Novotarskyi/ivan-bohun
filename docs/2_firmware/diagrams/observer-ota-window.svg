<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" font-family="ui-monospace,Menlo,monospace"><rect width="1440" height="700" fill="#0a0a0c"/><defs><marker id="ma05de0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a05de0"/></marker><marker id="m9a98a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a98a0"/></marker><marker id="mc4f04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4f04d"/></marker><marker id="m4dc46a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4dc46a"/></marker><marker id="m5dc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5dc8f0"/></marker><marker id="mf0a04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a04d"/></marker><marker id="m5a5a64" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a64"/></marker><marker id="me05555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e05555"/></marker><marker id="me8e6e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8e6e3"/></marker></defs><text x="40" y="52" font-size="24" fill="#c4f04d" text-anchor="start" font-weight="700" letter-spacing=".05em">THE OBSERVER OTA WINDOW - one life, start to finish</text><text x="40" y="78" font-size="12.5" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">a radio-only observer borrows WiFi for ten minutes, takes its release through the same guarded door, and proves the new image or rolls back</text><text x="1400" y="52" font-size="13" fill="#5a5a64" text-anchor="end" letter-spacing=".03em">observer-ota-window</text><rect x="40" y="150" width="240" height="190" fill="#111115" stroke="#a05de0" stroke-width="1.4" rx="8"/><text x="54" y="174" font-size="13.5" fill="#a05de0" text-anchor="start" font-weight="600" letter-spacing=".03em">STEADY STATE</text><text x="54" y="194" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">radio-only: ESP-NOW</text><text x="54" y="210" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">witness, no IP stack</text><text x="54" y="226" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">active at all</text><text x="54" y="242" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="54" y="258" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">glass painting the</text><text x="54" y="274" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">fleet as always</text><rect x="360" y="150" width="250" height="190" fill="#111115" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="374" y="174" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">JOINING</text><text x="374" y="194" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">the STA netif driven</text><text x="374" y="210" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">by hand: MAC copied in,</text><text x="374" y="226" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">started, DHCP on assoc</text><text x="374" y="242" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="374" y="258" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">45 s budget for</text><text x="374" y="274" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">association + lease</text><rect x="690" y="150" width="280" height="190" fill="#111115" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="704" y="174" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">OPEN</text><text x="704" y="194" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">esp_https_server on :8443 -</text><text x="704" y="210" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">the same key-gated, variant-</text><text x="704" y="226" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">guarded /ota door the blades</text><text x="704" y="242" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">use (+ /page on the kobzar)</text><text x="704" y="258" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">address on the glass · rail</text><text x="704" y="274" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">slow-blinks amber · 600 s</text><rect x="1050" y="150" width="170" height="190" fill="#111115" stroke="#5dc8f0" stroke-width="1.4" rx="8"/><text x="1064" y="174" font-size="13.5" fill="#5dc8f0" text-anchor="start" font-weight="600" letter-spacing=".03em">TRIAL</text><text x="1064" y="194" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">reboot into the</text><text x="1064" y="210" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">new image,</text><text x="1064" y="226" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">PENDING_VERIFY</text><text x="1064" y="242" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="1064" y="258" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">60 s alive AND</text><text x="1064" y="274" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">one peer heard</text><rect x="1280" y="150" width="120" height="190" fill="#111115" stroke="#4dc46a" stroke-width="1.4" rx="8"/><text x="1294" y="174" font-size="13.5" fill="#4dc46a" text-anchor="start" font-weight="600" letter-spacing=".03em">VALID</text><text x="1294" y="194" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">the slot is</text><text x="1294" y="210" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">marked good;</text><text x="1294" y="226" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">this is the</text><text x="1294" y="242" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">firmware now</text><line x1="280" y1="220" x2="360" y2="220" stroke="#f0a04d" stroke-width="2.2" marker-end="url(#mf0a04d)"/><text x="320" y="202" font-size="10.5" fill="#f0a04d" text-anchor="middle" letter-spacing=".03em">hold touch 4 s</text><line x1="610" y1="220" x2="690" y2="220" stroke="#f0a04d" stroke-width="2.2" marker-end="url(#mf0a04d)"/><text x="650" y="202" font-size="10.5" fill="#f0a04d" text-anchor="middle" letter-spacing=".03em">assoc + DHCP</text><line x1="970" y1="220" x2="1050" y2="220" stroke="#5dc8f0" stroke-width="2.2" marker-end="url(#m5dc8f0)"/><text x="1010" y="202" font-size="10.5" fill="#5dc8f0" text-anchor="middle" letter-spacing=".03em">image lands</text><line x1="1220" y1="220" x2="1280" y2="220" stroke="#4dc46a" stroke-width="2.2" marker-end="url(#m4dc46a)"/><path d="M 900 150 C 940 106 800 106 830 146" fill="none" stroke="#f0a04d" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#mf0a04d)"/><text x="868" y="116" font-size="10.5" fill="#f0a04d" text-anchor="middle" letter-spacing=".03em">an image in flight extends the deadline 60 s at a time</text><path d="M 470 340 C 470 410 240 410 178 346" fill="none" stroke="#e05555" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#me05555)"/><text x="392" y="402" font-size="10.5" fill="#e05555" text-anchor="start" letter-spacing=".03em">45 s without a lease: join failed, back to radio</text><path d="M 810 340 C 810 460 250 460 166 346" fill="none" stroke="#e05555" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#me05555)"/><text x="460" y="440" font-size="10.5" fill="#e05555" text-anchor="start" letter-spacing=".03em">600 s timeout, a cancelling tap, or a failed push:</text><text x="460" y="456" font-size="10.5" fill="#e05555" text-anchor="start" letter-spacing=".03em">server down, WiFi dropped, channel re-pinned</text><rect x="1050" y="430" width="350" height="96" fill="#111115" stroke="#e05555" stroke-width="1.4" rx="8"/><text x="1064" y="454" font-size="13.5" fill="#e05555" text-anchor="start" font-weight="600" letter-spacing=".03em">ROLLBACK</text><text x="1064" y="474" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">unproven past 300 s: reboot, and the</text><text x="1064" y="490" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">bootloader restores the previous slot -</text><text x="1064" y="506" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">a release cannot brick its delivery path</text><line x1="1135" y1="340" x2="1135" y2="430" stroke="#e05555" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#me05555)"/><text x="1210" y="388" font-size="10.5" fill="#e05555" text-anchor="middle" letter-spacing=".03em">no peer heard</text><text x="40" y="620" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">while the STA is associated the AP owns the channel, so heartbeats may miss for the window's duration - the roster shows the observer pale</text><text x="40" y="638" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">and recovers. Credentials are opt-in secrets: left empty, the trigger refuses on the glass and no radio state changes at all.</text></svg>