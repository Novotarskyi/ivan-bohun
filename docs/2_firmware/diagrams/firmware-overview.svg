<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="ui-monospace,Menlo,monospace"><rect width="1440" height="900" fill="#0a0a0c"/><defs><marker id="ma05de0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a05de0"/></marker><marker id="m9a98a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a98a0"/></marker><marker id="mc4f04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4f04d"/></marker><marker id="m4dc46a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4dc46a"/></marker><marker id="m5dc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5dc8f0"/></marker><marker id="mf0a04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a04d"/></marker><marker id="m5a5a64" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a64"/></marker><marker id="me05555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e05555"/></marker><marker id="me8e6e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8e6e3"/></marker></defs><text x="40" y="52" font-size="24" fill="#c4f04d" text-anchor="start" font-weight="700" letter-spacing=".05em">THE FIRMWARE - one tree, three images</text><text x="40" y="78" font-size="12.5" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">every board runs one of three variants; the swarm control plane is one set of files, compiled into all of them</text><text x="1400" y="52" font-size="13" fill="#5a5a64" text-anchor="end" letter-spacing=".03em">firmware-overview</text><rect x="40" y="120" width="430" height="248" fill="#111115" stroke="#4dc46a" stroke-width="1.4" rx="8"/><text x="54" y="144" font-size="13.5" fill="#4dc46a" text-anchor="start" font-weight="600" letter-spacing=".03em">bohun_eth - the serving blade</text><text x="54" y="164" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">board: LILYGO T-ETH-Lite (W5500)</text><text x="54" y="180" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">runs on: N1..N4</text><text x="54" y="196" font-size="11" fill="#e8e6e3" text-anchor="start" letter-spacing=".03em">its own modules:</text><text x="54" y="212" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  eth_main.c   boot sequencer</text><text x="54" y="228" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  serve.c      TLS servers + page + probe</text><text x="54" y="244" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  splice.c     the L4 load balancer</text><text x="54" y="260" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  selftest.c   post-OTA serving trial</text><text x="54" y="276" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  cpustat.c    /cpu accounting</text><text x="54" y="292" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="54" y="308" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">role: serve + swarm + mask + splice</text><rect x="510" y="120" width="430" height="248" fill="#111115" stroke="#5dc8f0" stroke-width="1.4" rx="8"/><text x="524" y="144" font-size="13.5" fill="#5dc8f0" text-anchor="start" font-weight="600" letter-spacing=".03em">bohun_display - the pysar</text><text x="524" y="164" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">board: DevKitC N16R8 + 2.8" TFT + rail</text><text x="524" y="180" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">runs on: the pysar</text><text x="524" y="196" font-size="11" fill="#e8e6e3" text-anchor="start" letter-spacing=".03em">its own modules:</text><text x="524" y="212" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  display_main.c  boot + render loop</text><text x="524" y="228" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  tft.c           panel + LVGL glass</text><text x="524" y="244" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  led.c           the six-pixel rail</text><text x="524" y="260" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="524" y="276" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="524" y="292" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="524" y="308" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">role: witness - roster on glass + light</text><rect x="970" y="120" width="430" height="248" fill="#111115" stroke="#a05de0" stroke-width="1.4" rx="8"/><text x="984" y="144" font-size="13.5" fill="#a05de0" text-anchor="start" font-weight="600" letter-spacing=".03em">bohun_mission - the kobzar</text><text x="984" y="164" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">board: Waveshare 4.3" touch panel</text><text x="984" y="180" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">runs on: the kobzar</text><text x="984" y="196" font-size="11" fill="#e8e6e3" text-anchor="start" letter-spacing=".03em">its own modules:</text><text x="984" y="212" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  mission_main.c  boot + 1 Hz render</text><text x="984" y="228" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  panel.c         CH422G/GT911/RGB565</text><text x="984" y="244" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  ui.c            the five touch tiles</text><text x="984" y="260" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="984" y="276" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="984" y="292" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em"></text><text x="984" y="308" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">role: witness - mission control on touch</text><rect x="40" y="440" width="1360" height="168" fill="#111115" stroke="#c4f04d" stroke-width="1.4" rx="8"/><text x="54" y="464" font-size="13.5" fill="#c4f04d" text-anchor="start" font-weight="600" letter-spacing=".03em">the shared core - firmware/eth/main/, compiled by path into all three (no copies, no fork)</text><rect x="62" y="484" width="156" height="100" fill="#16161c" stroke="#c4f04d" stroke-width="1.2" rx="7"/><text x="140.0" y="514" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">swarm.c</text><text x="140.0" y="538" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">radio, heartbeat,</text><text x="140.0" y="552" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">roster, election</text><rect x="230" y="484" width="156" height="100" fill="#16161c" stroke="#2a2a33" stroke-width="1.2" rx="7"/><text x="308.0" y="514" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">swarm_identity.c</text><text x="308.0" y="538" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">eFuse MAC -&gt;</text><text x="308.0" y="552" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">the fleet ledger</text><rect x="398" y="484" width="156" height="100" fill="#16161c" stroke="#c4f04d" stroke-width="1.2" rx="7"/><text x="476.0" y="514" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">mask.c</text><text x="476.0" y="538" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">vMAC, address,</text><text x="476.0" y="552" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">gARP, lease memory</text><rect x="566" y="484" width="156" height="100" fill="#16161c" stroke="#2a2a33" stroke-width="1.2" rx="7"/><text x="644.0" y="514" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">ota.c</text><text x="644.0" y="538" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">the /ota door:</text><text x="644.0" y="552" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">key + variant guard</text><rect x="734" y="484" width="156" height="100" fill="#16161c" stroke="#2a2a33" stroke-width="1.2" rx="7"/><text x="812.0" y="514" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">ota_window.c</text><text x="812.0" y="538" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">the observers'</text><text x="812.0" y="552" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">touch-held window</text><rect x="902" y="484" width="156" height="100" fill="#16161c" stroke="#2a2a33" stroke-width="1.2" rx="7"/><text x="980.0" y="514" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">blackbox.c</text><text x="980.0" y="538" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">the flight-</text><text x="980.0" y="552" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">recorder ring</text><rect x="1070" y="484" width="156" height="100" fill="#16161c" stroke="#2a2a33" stroke-width="1.2" rx="7"/><text x="1148.0" y="514" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">vitals.c</text><text x="1148.0" y="538" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">on-die</text><text x="1148.0" y="552" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">temperature</text><rect x="1238" y="484" width="156" height="100" fill="#16161c" stroke="#c4f04d" stroke-width="1.2" rx="7"/><text x="1316.0" y="514" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">logic.h</text><text x="1316.0" y="538" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">pure decision</text><text x="1316.0" y="552" font-size="10" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">kernels, host-tested</text><line x1="255" y1="368" x2="255" y2="434" stroke="#9a98a0" stroke-width="1.8" stroke-dasharray="3 4" marker-end="url(#m9a98a0)"/><line x1="725" y1="368" x2="725" y2="434" stroke="#9a98a0" stroke-width="1.8" stroke-dasharray="3 4" marker-end="url(#m9a98a0)"/><line x1="1185" y1="368" x2="1185" y2="434" stroke="#9a98a0" stroke-width="1.8" stroke-dasharray="3 4" marker-end="url(#m9a98a0)"/><text x="738" y="404" font-size="10.5" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">compiled by path</text><text x="60" y="634" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">weak symbols close the seam: swarm.c carries weak-false serve_is_ready()/serve_is_real() stubs, so an observer build links the whole</text><text x="60" y="652" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">control plane with no server aboard - and can never gossip serving=1 or win an election its firmware could not honour.</text><text x="60" y="680" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">ota_window.c compiles into the observers only; serve.c, splice.c, selftest.c and cpustat.c into the blades only. Everything else is everywhere.</text><text x="40" y="750" font-size="12" fill="#e8e6e3" text-anchor="start" font-weight="700" letter-spacing=".14em">WHERE THE DETAIL LIVES</text><rect x="40" y="760" width="218" height="62" fill="#16161c" stroke="#2a2a33" stroke-width="1.2" rx="7"/><text x="50" y="786" font-size="11" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">21_intake.md</text><text x="50" y="806" font-size="9.8" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">any board's first day</text><rect x="268" y="760" width="218" height="62" fill="#16161c" stroke="#4dc46a" stroke-width="1.2" rx="7"/><text x="278" y="786" font-size="11" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">22_node_serving.md</text><text x="278" y="806" font-size="9.8" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">the blade: servers, page, probe</text><rect x="496" y="760" width="218" height="62" fill="#16161c" stroke="#c4f04d" stroke-width="1.2" rx="7"/><text x="506" y="786" font-size="11" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">23_node_swarm.md</text><text x="506" y="806" font-size="9.8" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">the shared control plane</text><rect x="724" y="760" width="218" height="62" fill="#16161c" stroke="#5dc8f0" stroke-width="1.2" rx="7"/><text x="734" y="786" font-size="11" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">24_display_led.md</text><text x="734" y="806" font-size="9.8" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">the pysar: glass + rail</text><rect x="952" y="760" width="218" height="62" fill="#16161c" stroke="#a05de0" stroke-width="1.2" rx="7"/><text x="962" y="786" font-size="11" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">25_display_mission_control.md</text><text x="962" y="806" font-size="9.8" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">the kobzar: five tiles</text><rect x="1180" y="760" width="218" height="62" fill="#16161c" stroke="#f0a04d" stroke-width="1.2" rx="7"/><text x="1190" y="786" font-size="11" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">26_ota_deployments.md</text><text x="1190" y="806" font-size="9.8" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">every release path</text></svg>