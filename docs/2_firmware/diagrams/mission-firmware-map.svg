<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" font-family="ui-monospace,Menlo,monospace"><rect width="1440" height="920" fill="#0a0a0c"/><defs><marker id="ma05de0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a05de0"/></marker><marker id="m9a98a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a98a0"/></marker><marker id="mc4f04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4f04d"/></marker><marker id="m4dc46a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4dc46a"/></marker><marker id="m5dc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5dc8f0"/></marker><marker id="mf0a04d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a04d"/></marker><marker id="m5a5a64" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a64"/></marker><marker id="me05555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e05555"/></marker><marker id="me8e6e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8e6e3"/></marker></defs><text x="40" y="52" font-size="24" fill="#c4f04d" text-anchor="start" font-weight="700" letter-spacing=".05em">THE KOBZAR FIRMWARE - gossip in, five tiles out</text><text x="40" y="78" font-size="12.5" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">bohun_mission: the shared control plane on radio, an 800x480 touch dashboard, and the fleet's long memory in NVS</text><text x="1400" y="52" font-size="13" fill="#5a5a64" text-anchor="end" letter-spacing=".03em">mission-firmware-map</text><text x="230.0" y="118" font-size="12" fill="#a05de0" text-anchor="middle" font-weight="700" letter-spacing=".14em">THE RADIO PLANE</text><text x="705.0" y="118" font-size="12" fill="#5dc8f0" text-anchor="middle" font-weight="700" letter-spacing=".14em">THE DASHBOARD</text><text x="1195.0" y="118" font-size="12" fill="#f0a04d" text-anchor="middle" font-weight="700" letter-spacing=".14em">PANEL + RELEASES</text><rect x="40" y="140" width="380" height="58" fill="#16161c" stroke="#a05de0" stroke-width="1.4" rx="8"/><text x="54" y="164" font-size="13.5" fill="#a05de0" text-anchor="start" font-weight="600" letter-spacing=".03em">the fleet</text><text x="54" y="184" font-size="11" fill="#5a5a64" text-anchor="start" letter-spacing=".03em">every member's heartbeat, 1 Hz, encrypted</text><rect x="40" y="232" width="380" height="52" fill="#16161c" stroke="#a05de0" stroke-width="1.2" rx="7"/><text x="230.0" y="250.0" font-size="12.5" fill="#a05de0" text-anchor="middle" font-weight="600" letter-spacing=".03em">ESP-NOW radio</text><text x="230.0" y="270.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">hears everything, can win nothing</text><rect x="40" y="318" width="380" height="120" fill="#111115" stroke="#a05de0" stroke-width="1.4" rx="8"/><text x="54" y="342" font-size="13.5" fill="#a05de0" text-anchor="start" font-weight="600" letter-spacing=".03em">the shared control plane</text><text x="54" y="362" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">swarm.c + swarm_identity.c + mask.c</text><text x="54" y="378" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">+ logic.h, straight out of eth/main/</text><text x="54" y="394" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">witness: eligible=false</text><rect x="40" y="472" width="380" height="56" fill="#16161c" stroke="#c4f04d" stroke-width="1.2" rx="7"/><text x="230.0" y="492.0" font-size="12.5" fill="#c4f04d" text-anchor="middle" font-weight="600" letter-spacing=".03em">swarm_snapshot()</text><text x="230.0" y="512.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">the single fleet view, read at 1 Hz</text><rect x="40" y="566" width="380" height="110" fill="#111115" stroke="#c4f04d" stroke-width="1.4" rx="8"/><text x="54" y="590" font-size="13.5" fill="#c4f04d" text-anchor="start" font-weight="600" letter-spacing=".03em">NVS - the fleet's long memory</text><text x="54" y="610" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">reign records: each otaman's reign, the</text><text x="54" y="626" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">longest persisted (holder + length),</text><text x="54" y="642" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">record-breaks chronicled</text><line x1="230.0" y1="198" x2="230.0" y2="226" stroke="#a05de0" stroke-width="1.8" marker-end="url(#ma05de0)"/><line x1="230.0" y1="284" x2="230.0" y2="312" stroke="#a05de0" stroke-width="1.8" marker-end="url(#ma05de0)"/><line x1="230.0" y1="438" x2="230.0" y2="466" stroke="#c4f04d" stroke-width="1.8" marker-end="url(#mc4f04d)"/><line x1="230.0" y1="528" x2="230.0" y2="560" stroke="#c4f04d" stroke-width="1.8" stroke-dasharray="3 4" marker-end="url(#mc4f04d)"/><text x="230.0" y="550" font-size="10.5" fill="#c4f04d" text-anchor="middle" letter-spacing=".03em">what must outlive the fleet</text><rect x="470" y="140" width="470" height="78" fill="#111115" stroke="#5dc8f0" stroke-width="1.4" rx="8"/><text x="484" y="164" font-size="13.5" fill="#5dc8f0" text-anchor="start" font-weight="600" letter-spacing=".03em">mission_main.c</text><text x="484" y="184" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">boot: NVS, blackbox, panel, UI, swarm_start(), the boot trial -</text><text x="484" y="200" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">then a 1 Hz render task feeds ui_update() from the snapshot</text><rect x="470" y="252" width="470" height="318" fill="#111115" stroke="#5dc8f0" stroke-width="1.4" rx="8"/><text x="484" y="276" font-size="13.5" fill="#5dc8f0" text-anchor="start" font-weight="600" letter-spacing=".03em">ui.c - the five tiles (swipe order)</text><text x="484" y="296" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">1 MISSION CONTROL - node cards + detail</text><text x="484" y="312" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">    overlays, fleet traffic + latency chart,</text><text x="484" y="328" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">    availability arc, the chronicle with the</text><text x="484" y="344" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">    reboot coroner, reign records</text><text x="484" y="360" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">2 THE LEDGER - per-blade HTTP 200s over</text><text x="484" y="376" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">    the per-code refusal table</text><text x="484" y="392" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">3 CONVERSIONS - outbound-link counters</text><text x="484" y="408" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">4 THE RADIO - the gossip tail, ~45 s,</text><text x="484" y="424" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">    RSSI + sequence-gap markers</text><text x="484" y="440" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">5 THE PAGE - the served site, baked to</text><text x="484" y="456" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">    RGB565, scrolling in its own viewport</text><rect x="470" y="606" width="470" height="56" fill="#16161c" stroke="#9a98a0" stroke-width="1.2" rx="7"/><text x="705.0" y="626.0" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">page-strip partition</text><text x="705.0" y="646.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">the site as an 800px RGB565 strip, memory-mapped by tile 5</text><rect x="470" y="698" width="470" height="92" fill="#111115" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="484" y="722" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">touch surfaces</text><text x="484" y="742" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">node cards + chronicle open overlays · a</text><text x="484" y="758" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">footer tap blanks the backlight (CH422G) ·</text><text x="484" y="774" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">flag or arms held 4 s opens the OTA window</text><path d="M 424 500 C 430 500 430 240 466 232" fill="none" stroke="#c4f04d" stroke-width="2.2" marker-end="url(#mc4f04d)"/><text x="444" y="420" font-size="10.5" fill="#c4f04d" text-anchor="middle" letter-spacing=".03em" transform="rotate(-90 444 420)">snapshot, 1 Hz</text><line x1="705.0" y1="218" x2="705.0" y2="246" stroke="#5dc8f0" stroke-width="1.8" marker-end="url(#m5dc8f0)"/><line x1="705.0" y1="606" x2="705.0" y2="576" stroke="#9a98a0" stroke-width="1.8" marker-end="url(#m9a98a0)"/><text x="783.0" y="584.0" font-size="10.5" fill="#9a98a0" text-anchor="middle" letter-spacing=".03em">tile 5 maps it</text><rect x="990" y="140" width="410" height="178" fill="#111115" stroke="#9a98a0" stroke-width="1.4" rx="8"/><text x="1004" y="164" font-size="13.5" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">panel.c - the bring-up</text><text x="1004" y="184" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">CH422G expander first (it owns backlight,</text><text x="1004" y="200" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  touch reset, LCD reset - reset dance,</text><text x="1004" y="216" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  20 ms, release with backlight on)</text><text x="1004" y="232" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">RGB565 panel, two PSRAM frame buffers</text><text x="1004" y="248" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  + bounce buffers, avoid_tearing</text><text x="1004" y="264" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">GT911 touch, polled (rst/int unwired)</text><text x="1004" y="280" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">esp_lvgl_port, full_refresh</text><rect x="990" y="352" width="410" height="52" fill="#16161c" stroke="#9a98a0" stroke-width="1.2" rx="7"/><text x="1195.0" y="370.0" font-size="12.5" fill="#e8e6e3" text-anchor="middle" font-weight="600" letter-spacing=".03em">4.3" IPS 800x480</text><text x="1195.0" y="390.0" font-size="10.5" fill="#5a5a64" text-anchor="middle" letter-spacing=".03em">parallel RGB565 @ 16 MHz, 5-point touch</text><rect x="990" y="440" width="410" height="170" fill="#111115" stroke="#f0a04d" stroke-width="1.4" rx="8"/><text x="1004" y="464" font-size="13.5" fill="#f0a04d" text-anchor="start" font-weight="600" letter-spacing=".03em">ota_window.c - the release path</text><text x="1004" y="484" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">the same touch-held window as the pysar:</text><text x="1004" y="500" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">join by hand, :8443 door, 600 s, cancel on</text><text x="1004" y="516" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">tap - narrated by a full-screen amber modal</text><text x="1004" y="532" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">plus /page: writes the strip partition</text><text x="1004" y="548" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">  directly; asks for a restart, never forces</text><rect x="990" y="646" width="410" height="88" fill="#111115" stroke="#9a98a0" stroke-width="1.4" rx="8"/><text x="1004" y="670" font-size="13.5" fill="#e8e6e3" text-anchor="start" font-weight="600" letter-spacing=".03em">dual slots + boot trial</text><text x="1004" y="690" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">a fresh image must hear one peer within</text><text x="1004" y="706" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">its trial or the bootloader rolls back</text><line x1="1195.0" y1="318" x2="1195.0" y2="346" stroke="#9a98a0" stroke-width="1.8" marker-end="url(#m9a98a0)"/><line x1="1195.0" y1="610" x2="1195.0" y2="640" stroke="#f0a04d" stroke-width="1.8" marker-end="url(#mf0a04d)"/><path d="M 944 744 C 960 744 960 560 986 528" fill="none" stroke="#f0a04d" stroke-width="1.8" marker-end="url(#mf0a04d)"/><text x="954" y="660" font-size="10.5" fill="#f0a04d" text-anchor="middle" letter-spacing=".03em" transform="rotate(-90 954 660)">4 s hold</text><text x="40" y="830" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">an integrated board: its own S3, no wires to the fleet. First flash (app AND page strip) over USB; after that, app releases through the window</text><text x="40" y="848" font-size="11" fill="#9a98a0" text-anchor="start" letter-spacing=".03em">and the strip through the same window with --page. TLS handshake buffers live in PSRAM - the 800x480 UI owns most of internal RAM.</text></svg>