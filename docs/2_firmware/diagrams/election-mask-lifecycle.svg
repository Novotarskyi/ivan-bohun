<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
<rect width="1100" height="640" fill="#0a0a0c"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a7880"/></marker></defs>
<text x="28" y="40" font-size="18" fill="#c4f04d">THE ELECTION AND THE MASK - one blade's life</text>
<text x="28" y="62" font-size="11" fill="#7a7880">deterministic: the lowest id that is alive on the radio, healthy on the wire, and serving, leads</text>
<rect x="60" y="110" width="190" height="92" rx="4" fill="#111115" stroke="#7a7880" stroke-width="1.6"/>
<text x="155.0" y="132" font-size="13" fill="#7a7880" text-anchor="middle">BOOT</text>
<text x="155.0" y="152" font-size="10" fill="#a8a6a3" text-anchor="middle">own MAC, own DHCP</text>
<text x="155.0" y="168" font-size="10" fill="#a8a6a3" text-anchor="middle">TLS server starting</text>
<text x="155.0" y="184" font-size="10" fill="#a8a6a3" text-anchor="middle">gossips, ineligible</text>
<rect x="60" y="300" width="190" height="100" rx="4" fill="#111115" stroke="#43e86a" stroke-width="1.6"/>
<text x="155.0" y="322" font-size="13" fill="#43e86a" text-anchor="middle">CANDIDATE</text>
<text x="155.0" y="342" font-size="10" fill="#a8a6a3" text-anchor="middle">serve gate passed:</text>
<text x="155.0" y="358" font-size="10" fill="#a8a6a3" text-anchor="middle">listener up + self-probe</text>
<text x="155.0" y="374" font-size="10" fill="#a8a6a3" text-anchor="middle">heartbeat says serving</text>
<rect x="420" y="300" width="220" height="100" rx="4" fill="#111115" stroke="#c4f04d" stroke-width="1.6"/>
<text x="530.0" y="322" font-size="13" fill="#c4f04d" text-anchor="middle">OTAMAN</text>
<text x="530.0" y="342" font-size="10" fill="#a8a6a3" text-anchor="middle">wears the vMAC + .50</text>
<text x="530.0" y="358" font-size="10" fill="#a8a6a3" text-anchor="middle">gratuitous ARP</text>
<text x="530.0" y="374" font-size="10" fill="#a8a6a3" text-anchor="middle">runs the L4 splicer</text>
<rect x="760" y="300" width="240" height="100" rx="4" fill="#111115" stroke="#ffb020" stroke-width="1.6"/>
<text x="880.0" y="322" font-size="13" fill="#ffb020" text-anchor="middle">ABDICATING</text>
<text x="880.0" y="342" font-size="10" fill="#a8a6a3" text-anchor="middle">drain relays</text>
<text x="880.0" y="358" font-size="10" fill="#a8a6a3" text-anchor="middle">restore own MAC</text>
<text x="880.0" y="374" font-size="10" fill="#a8a6a3" text-anchor="middle">reuse remembered lease</text>
<rect x="420" y="480" width="220" height="92" rx="4" fill="#111115" stroke="#ff5555" stroke-width="1.6"/>
<text x="530.0" y="502" font-size="13" fill="#ff5555" text-anchor="middle">LOST / WEDGED</text>
<text x="530.0" y="522" font-size="10" fill="#a8a6a3" text-anchor="middle">3 s of radio silence,</text>
<text x="530.0" y="538" font-size="10" fill="#a8a6a3" text-anchor="middle">or self-probe fails 2x:</text>
<text x="530.0" y="554" font-size="10" fill="#a8a6a3" text-anchor="middle">benched + not a candidate</text>
<path d="M155,202 L155,300" stroke="#43e86a" stroke-width="2" marker-end="url(#ar)"/>
<text x="190" y="255" font-size="10" fill="#43e86a" text-anchor="middle">serving</text>
<path d="M250,350 L420,350" stroke="#c4f04d" stroke-width="2" marker-end="url(#ar)"/>
<text x="335" y="338" font-size="10" fill="#c4f04d" text-anchor="middle">lowest healthy id</text>
<path d="M640,350 L760,350" stroke="#ffb020" stroke-width="2" marker-end="url(#ar)"/>
<text x="700" y="312" font-size="10" fill="#ffb020" text-anchor="middle">link lost /</text>
<text x="700" y="326" font-size="10" fill="#ffb020" text-anchor="middle">serve lost /</text>
<text x="700" y="340" font-size="10" fill="#ffb020" text-anchor="middle">standby / outranked</text>
<path d="M880,300 C880,210 250,210 158,296" fill="none" stroke="#43e86a" stroke-width="2" marker-end="url(#ar)"/>
<text x="520" y="204" font-size="10" fill="#43e86a" text-anchor="middle">rejoins as kozak - a role, not a machine</text>
<path d="M300,400 L460,480" stroke="#ff5555" stroke-width="2" marker-end="url(#ar)"/>
<text x="286" y="430" font-size="10" fill="#ff5555" text-anchor="middle">probe fails 2x</text>
<path d="M530,480 C500,440 340,430 262,398" fill="none" stroke="#43e86a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="600" y="466" font-size="10" fill="#43e86a" text-anchor="middle">probe passes again</text>
<path d="M640,540 C700,540 700,572 640,566" fill="none" stroke="#ff5555" stroke-width="2" marker-end="url(#ar)"/>
<text x="742" y="560" font-size="10" fill="#ff5555">6 fails: abort() for a</text>
<text x="742" y="574" font-size="10" fill="#ff5555">coredump, reboot to BOOT</text>
<rect x="60" y="596" width="980" height="1" fill="#2a2a33"/>
<text x="60" y="622" font-size="10" fill="#7a7880">constants: heartbeat 1 Hz - peer lost after 3 s - election tick 200 ms - link grace 6 s - self-probe every 7 s - handover observed under 4 s</text>
</svg>