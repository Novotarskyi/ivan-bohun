<text x="558" y="500" font-size="9.5" fill="#8a93a6" text-anchor="middle">(row F holds the chip's far-side legs)</text>
<!-- callouts -->
<text x="670" y="545" font-size="12.5" fill="#e8b04a" text-anchor="middle">J5-J8 and J10 hop OVER the 5V rail - insulated wire, the crossing touches nothing  ·  J9 is the shortest wire on the board, crosses nothing</text>
<text x="670" y="567" font-size="11.5" fill="#8a93a6" text-anchor="middle">near edge: - is the INNER row there, so J1-J4 land as mapped  ·  near + (OUTER) stays unused  ·  meter check: far - to far + must read OPEN</text>
<text x="670" y="588" font-size="10.5" fill="#b8e05a" text-anchor="middle">far-edge companion to guide-17b-wiring.png - P1/P4 are soldered pins; T1/W1 are intact dupont heads pushed onto them</text>
