<line x1="62" y1="626" x2="62" y2="718" stroke="#c4f04d" stroke-width="3"/>
<text x="78.0" y="646.0" font-size="11" fill="#e8e6e3" text-anchor="start">IPA-wipe both faces. Place ONCE - VHB does not reposition.</text>
<text x="78.0" y="668.0" font-size="11" fill="#e8e6e3" text-anchor="start">Press each strip 30-60 s hard. Full cure 24-72 h:</text>
<text x="78.0" y="690.0" font-size="11" fill="#e8e6e3" text-anchor="start">gentle with the looms tonight.</text>
<text x="78.0" y="712.0" font-size="11" fill="#7a7880" text-anchor="start">Pads used: 2 of 12. The other 10: charger, switch, fan feet.</text>
