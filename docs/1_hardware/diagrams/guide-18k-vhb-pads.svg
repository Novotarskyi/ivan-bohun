<text x="815.0" y="636.0" font-size="10" fill="#a8a6a3" text-anchor="middle">one 50 x 30 pad -> three 10 x 50 strips</text>
<text x="815.0" y="654.0" font-size="10" fill="#a8a6a3" text-anchor="middle">scissors, cut with liners ON, peel later</text>
