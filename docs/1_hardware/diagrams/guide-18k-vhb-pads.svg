<text x="700.0" y="458.0" font-size="10" fill="#a8a6a3" text-anchor="start">borders are 3 mm top / 7 mm chin -</text>
<text x="700.0" y="474.0" font-size="10" fill="#a8a6a3" text-anchor="start">too thin for 30 mm foam. doc 18's call</text>
<text x="700.0" y="490.0" font-size="10" fill="#a8a6a3" text-anchor="start">stands: thin tape on the GLASS borders,</text>
<text x="700.0" y="506.0" font-size="10" fill="#a8a6a3" text-anchor="start">screen sits flush; header hangs below.</text>
<text x="700.0" y="466.0" font-size="13" fill="#e8e6e3" text-anchor="start">CUTTING PLAN - two pads make six strips (four used)</text>
